name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Motor matemático y app Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Pruebas del motor (JVM puro, tiempo de ejecución real)
        run: ./gradlew :shared:math-engine:jvmTest --stacktrace

      - name: Pruebas del motor (target Android, host)
        run: ./gradlew :shared:math-engine:testAndroidHostTest --stacktrace

      - name: Compilar APK debug
        run: ./gradlew :apps:androidApp:assembleDebug --stacktrace

      - name: Subir informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: math-engine-test-reports
          path: shared/math-engine/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: androidApp-debug
          path: apps/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
