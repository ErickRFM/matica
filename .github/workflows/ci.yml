name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    # Nombre estable a propósito: la protección de `main` exige este check exacto.
    # Añadir módulos no cambia el nombre, solo se agregan pasos.
    name: Verificación Full Kotlin
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: wrapper
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Backend Ktor (pruebas sin credenciales ni PostgreSQL)
        run: ./gradlew -Pmatica.backendOnly=true :backend:api:test --stacktrace

      - name: Pruebas del servicio simbólico (contrato y seguridad)
        working-directory: tools/symbolic-service
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pytest -q tests

      - name: Pruebas del motor (JVM puro, tiempo de ejecución real)
        run: ./gradlew :shared:math-engine:jvmTest --stacktrace

      - name: Pruebas del motor (target Android, host)
        run: ./gradlew :shared:math-engine:testAndroidHostTest --stacktrace

      - name: Pruebas de la fachada remota (JVM, MockEngine sin servicio)
        run: ./gradlew :shared:math-remote:jvmTest --stacktrace

      - name: Pruebas de la fachada remota (target Android, host)
        run: ./gradlew :shared:math-remote:testAndroidHostTest --stacktrace

      - name: Pruebas del motor de aprendizaje (JVM)
        run: ./gradlew :shared:learning-engine:jvmTest --stacktrace

      - name: Pruebas del motor de aprendizaje (target Android, host)
        run: ./gradlew :shared:learning-engine:testAndroidHostTest --stacktrace

      - name: Pruebas de las plantillas de ejercicio (JVM)
        run: ./gradlew :shared:exercises:jvmTest --stacktrace

      - name: Pruebas de las plantillas de ejercicio (target Android, host)
        run: ./gradlew :shared:exercises:testAndroidHostTest --stacktrace

      - name: Pruebas del sistema visual (JVM)
        run: ./gradlew :design-system:jvmTest --stacktrace

      - name: Pruebas del sistema visual (target Android, host)
        run: ./gradlew :design-system:testAndroidHostTest --stacktrace

      - name: Compilar la capa de presentación (JVM)
        run: ./gradlew :shared:presentation:compileKotlinJvm --stacktrace

      - name: Pruebas de rutas, sesión y renderizador (JVM)
        run: ./gradlew :shared:presentation:jvmTest --stacktrace

      - name: Pruebas de rutas, sesión y renderizador (target Android, host)
        run: ./gradlew :shared:presentation:testAndroidHostTest --stacktrace

      - name: Compilar APK debug
        run: ./gradlew :apps:androidApp:assembleDebug --stacktrace

      - name: Subir informes de pruebas
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            shared/math-engine/build/reports/tests/
            shared/math-remote/build/reports/tests/
            shared/learning-engine/build/reports/tests/
            shared/exercises/build/reports/tests/
            shared/presentation/build/reports/tests/
            design-system/build/reports/tests/
            backend/api/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 14

      - name: Subir APK debug
        uses: actions/upload-artifact@v7
        with:
          name: androidApp-debug
          path: apps/androidApp/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
