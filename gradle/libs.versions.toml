[versions]
# Todas las versiones fueron verificadas contra los repositorios públicos
# (Maven Central / Google Maven / plugins.gradle.org) el 2026-11-04.
agp = "9.5.0"
kotlin = "2.4.21"
composeMultiplatform = "1.9.3"
kotlinxCoroutines = "1.11.0"
kotlinxSerialization = "1.12.0"
kotlinxDatetime = "0.8.0"
ktor = "3.6.1"
sqldelight = "2.4.1"
koin = "4.2.2"
koinCompose = "4.2.2"
androidxCore = "1.19.1"
androidxActivityCompose = "1.14.0-alpha03"
androidxLifecycle = "2.12.0-alpha05"
navigationCompose = "2.10.2"
composeBom = "2026.09.00"
datastore = "1.3.0"
workManager = "2.12.0"
sqldelightAndroid = "2.4.1"
turbine = "1.2.1"
junitJupiter = "5.14.4"
kotlinTest = "2.4.21"
bignum = "0.3.10"
logback = "1.5.22"
postgresJdbc = "42.7.5"
kmath = "0.6.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
