# API Mática: Render Ktor conecta a un proyecto PostgreSQL exclusivo de Supabase.\n# /readyz exige esquema Mática v1 y conexión SQL real; no usar /healthz para certificar BD.
# Servicio simbólico existente matica-symbolic-staging NO se modifica.
services:
  - type: web
    name: matica-api-staging
    runtime: docker
    repo: https://github.com/ErickRFM/matica
    branch: main
    dockerContext: .
    dockerfilePath: ./backend/api/Dockerfile
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: DATABASE_URL
        sync: false
